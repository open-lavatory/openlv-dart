name: Publish release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Verify tag matches package version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(sed -n 's/^version: *//p' pubspec.yaml)
          [[ "$version" == "$package_version" ]] || {
            echo "Tag version $version does not match pubspec.yaml version $package_version" >&2
            exit 1
          }
      - name: Install dependencies
        run: dart pub get --no-example
      - name: Validate package
        run: dart pub publish --dry-run
      - name: Publish to pub.dev
        run: dart pub publish --force
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "OpenLV $GITHUB_REF_NAME" --generate-notes
