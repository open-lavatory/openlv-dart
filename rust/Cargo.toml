[package]
name = "openlv_ffi"
version = "0.1.0"
edition = "2024"
publish = false
description = "flutter_rust_bridge glue crate for the openlv Dart SDK"

[lib]
name = "openlv_ffi"
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
openlv = { git = "https://github.com/open-lavatory/openlv-rs", rev = "71ed27338a083422c7d335f50ff99a6f0cc8ada7" }

flutter_rust_bridge = "=2.13.0"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
